# Caddy for RenkuOS/Haiku, the standard modules only. The default admin
# address is 127.0.0.1:2019, not localhost:2019: Go programs on Haiku cannot
# resolve "localhost" (there is no /etc/hosts), so Caddy would not start with
# the default configuration and "caddy stop" would not find it.
REPO=https://github.com/caddyserver/caddy.git
TAG=v2.11.9
VERSION=2.11.9
MAIN=./cmd/caddy
BIN=caddy
PKG=caddy
BUILD_TAGS=
DEPS="sys xterm cterm isatty termenv bbolt flock logrus afero ctgo readline"
ldflags() {
	echo "-X github.com/caddyserver/caddy/v2.CustomVersion=$TAG" \
		"-X github.com/caddyserver/caddy/v2.DefaultAdminListen=127.0.0.1:2019"
}
prebuild() { :; }
SUMMARY="Web server with automatic HTTPS"
DESCRIPTION="Caddy $VERSION built for RenkuOS/Haiku, with the standard modules: static file server, reverse proxy, automatic HTTPS and the Caddyfile. Unofficial build, not affiliated with the Caddy project."
LICENSES="Apache v2"
COPYRIGHTS="2015-2026 Matthew Holt and The Caddy Authors"
HOMEPAGE=https://caddyserver.com
UPSTREAM_LICENSE=LICENSE
