# Hugo for RenkuOS/Haiku, the standard edition (no cgo, so no "extended"
# Sass/WebP). v0.165.0 is the newest release that builds with Go 1.26,
# which is what the 32-bit toolchain is.
REPO=https://github.com/gohugoio/hugo.git
TAG=v0.165.0
VERSION=0.165.0
MAIN=.
BIN=hugo
PKG=hugo
BUILD_TAGS=
DEPS="sys xterm isatty termenv afero sftp azblob mclib wazero gointernal"
ldflags() {
	echo "-X github.com/gohugoio/hugo/common/hugo.vendorInfo=renkuos" \
		"-X github.com/gohugoio/hugo/common/hugo.buildDate=$(git -C "$src" log -1 --format=%cI)"
}
prebuild() { :; }
SUMMARY="Fast static site generator"
DESCRIPTION="Hugo $VERSION built for RenkuOS/Haiku. Builds websites from Markdown and templates, and previews them with its own web server (hugo server). This is the standard edition: the extended edition's Sass and WebP encoders need cgo. Unofficial build, not affiliated with the Hugo project."
LICENSES="Apache v2"
COPYRIGHTS="2013-2026 The Hugo Authors"
HOMEPAGE=https://gohugo.io
UPSTREAM_LICENSE=LICENSE
