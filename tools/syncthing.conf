# Syncthing for RenkuOS/Haiku. v1.30.0 is the last release that keeps its
# database in LevelDB (pure Go). v2 needs SQLite through modernc.org/libc,
# which has no Haiku port.
REPO=https://github.com/syncthing/syncthing.git
TAG=v1.30.0
VERSION=1.30.0
MAIN=./cmd/syncthing
BIN=syncthing
PKG=syncthing
BUILD_TAGS=noupgrade
DEPS="sys flock goleveldb"
ldflags() {
	echo "-X github.com/syncthing/syncthing/lib/build.Version=$TAG" \
		"-X github.com/syncthing/syncthing/lib/build.Stamp=$(git -C "$src" log -1 --format=%ct)" \
		"-X github.com/syncthing/syncthing/lib/build.User=renkuos" \
		"-X github.com/syncthing/syncthing/lib/build.Host=renkuos" \
		"-X github.com/syncthing/syncthing/lib/build.Tags=noupgrade"
}
# The web GUI is compiled in from a generated file; the generator is a host
# program.
prebuild() { (cd "$src/lib/api/auto" && env -u GOOS -u GOARCH "$go" generate .); }
SUMMARY="Continuous file synchronization between your own devices"
DESCRIPTION="Syncthing $VERSION built for RenkuOS/Haiku. Synchronizes folders between devices, peer to peer and encrypted, and is set up from a web page on http://127.0.0.1:8384. This is the 1.x series: 2.x cannot be built for Haiku yet. Folders are rescanned on a timer, as there is no file watcher for Haiku, and automatic upgrades are disabled. Unofficial build, not affiliated with the Syncthing Foundation."
LICENSES="MPL v2.0"
COPYRIGHTS="2014-2025 The Syncthing Authors"
HOMEPAGE=https://syncthing.net
UPSTREAM_LICENSE=LICENSE
