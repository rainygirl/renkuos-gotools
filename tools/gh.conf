# GitHub CLI for RenkuOS/Haiku. v2.100.0 is the newest release that builds
# with Go 1.26, which is what the 32-bit toolchain is.
REPO=https://github.com/cli/cli.git
TAG=v2.100.0
VERSION=2.100.0
MAIN=./cmd/gh
BIN=gh
PKG=github_cli
BUILD_TAGS=
DEPS="sys xterm cterm isatty clipboard logrus termenv survey tcell2 bubbletea ctgo browser"
ldflags() {
	echo "-X github.com/cli/cli/v2/internal/build.Version=$VERSION" \
		"-X github.com/cli/cli/v2/internal/build.Date=$(git -C "$src" log -1 --format=%cs)"
}
prebuild() { :; }
SUMMARY="GitHub on the command line"
DESCRIPTION="GitHub CLI (gh) $VERSION built for RenkuOS/Haiku: pull requests, issues, releases, repositories and the GitHub API from Terminal. Unofficial build, not affiliated with GitHub."
LICENSES="MIT"
COPYRIGHTS="2019-2026 GitHub Inc."
HOMEPAGE=https://cli.github.com
UPSTREAM_LICENSE=LICENSE
