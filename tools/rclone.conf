# rclone for RenkuOS/Haiku
REPO=https://github.com/rclone/rclone.git
TAG=v1.76.0
VERSION=1.76.0
MAIN=.
BIN=rclone
PKG=rclone
BUILD_TAGS=
DEPS="sys xterm isatty xdg go-diskfs bbolt azblob azfile flock logrus sftp afero clipboard tcell"
ldflags() { echo "-X github.com/rclone/rclone/fs.Version=$TAG"; }
prebuild() { :; }
SUMMARY="rsync for cloud storage: sync files to and from many storage providers"
DESCRIPTION="rclone $VERSION built for RenkuOS/Haiku. Copies, syncs, checks and serves files between the local disk and S3, WebDAV, SFTP, HTTP and the other storage systems rclone supports. rclone mount is not available: Haiku has no FUSE the Go bindings can use. Unofficial build, not affiliated with the rclone project."
LICENSES="MIT"
COPYRIGHTS="2012-2026 Nick Craig-Wood and contributors"
HOMEPAGE=https://rclone.org
UPSTREAM_LICENSE=COPYING
