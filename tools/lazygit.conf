# lazygit for RenkuOS/Haiku
REPO=https://github.com/jesseduffield/lazygit.git
TAG=v0.66.3
VERSION=0.66.3
MAIN=.
BIN=lazygit
PKG=lazygit
BUILD_TAGS=
DEPS="sys xterm cterm isatty xdg logrus afero clipboard tcell termenv survey browser jibber pty"
ldflags() {
	echo "-X main.version=$VERSION -X main.buildSource=renkuos" \
		"-X main.commit=$(git -C "$src" rev-parse HEAD)" \
		"-X main.date=$(git -C "$src" log -1 --format=%cI)"
}
prebuild() { :; }
SUMMARY="Terminal UI for git"
DESCRIPTION="lazygit $VERSION built for RenkuOS/Haiku. Stage, commit, branch, rebase and browse history from a terminal interface. Needs git. Unofficial build, not affiliated with the lazygit project."
LICENSES="MIT"
COPYRIGHTS="2018-2026 Jesse Duffield"
HOMEPAGE=https://github.com/jesseduffield/lazygit
UPSTREAM_LICENSE=LICENSE
