# restic for RenkuOS/Haiku. v0.19.1: 0.20.0 asks for Go 1.26.10 and the
# 32-bit toolchain is 1.26.5.
REPO=https://github.com/restic/restic.git
TAG=v0.19.1
VERSION=0.19.1
MAIN=./cmd/restic
BIN=restic
PKG=restic
BUILD_TAGS=disable_grpc_modules
DEPS="sys xterm sftp azblob afero logrus"
ldflags() { :; }
prebuild() { :; }
SUMMARY="Fast, secure, efficient backup program"
DESCRIPTION="restic $VERSION built for RenkuOS/Haiku. Encrypted, deduplicated backups to a local directory, SFTP, a REST server, S3 and the other storage systems restic supports. restic mount and self-update are not available. Unofficial build, not affiliated with the restic project."
LICENSES="BSD (2-clause)"
COPYRIGHTS="2014-2026 Alexander Neumann and contributors"
HOMEPAGE=https://restic.net
UPSTREAM_LICENSE=LICENSE
